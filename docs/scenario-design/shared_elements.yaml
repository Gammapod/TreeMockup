Room Elements:
  description: these exist inside of a given room, and interact with the player.
  collectables:
    description: unlike room abilities, these are collected permanently
    coin: permanently increases coin count by 1 and disappears                                                           
    key: permanently increases max open doors by 1 and disappears                                                        
  enemies:
    description: > 
      Notes on Combat:                                                                                  
      we don't want to get too into the weeds on this, just a placeholder system. For now:           
      1. enemies can be defeated with one sword hit                                                                    
      2. enemies can only move if the player is in the same room                                                       
      3. surviving enemies respawn when the player exits their room                                                    
      4. defeated enemies respawn when their room becomes disconnected from root                                       
      5. enemies that touch the player reduce the player's current HP by 1                                             
      6. no penalty if the player reaches 0 HP (yet)                                                                   
    bats: slowly approaches player (at half of player's default speed), when player is in the room.
  hazards:
    description: block the player's movement
    water hazard: the player can cross water if the flippers ability is active
    wall hazard: the wall disappears and allows passage if an associated switch is toggled on
  interactable objects:
    description: misc elements
    switch: can be toggled on or off by being hit with the sword ability (initialized off)
Tech Tree Abilities:
  description: each room also activates an ability when connected to the active graph.
  abilities:                                                                                                      
    sword: when active, player can press spacebar to defeat nearby enemies (simple circular range around the player)
    flippers: when active, player can cross water hazards.
  stat upgrades:
    +n hp: when active, player's max hp is increased by n and the player is also healed by n upon activation
